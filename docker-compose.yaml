services:
  db:
      image: postgres:15-alpine
      container_name: db-bookmanager
      restart: always
      environment:
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: SenhaSQL
        POSTGRES_DB: book_manager
      ports:
        - "5434:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
  pgadmin:
      image: dpage/pgadmin4
      container_name: pgadmin-bookmanager
      restart: always
      environment:
        PGADMIN_DEFAULT_EMAIL: admin@admin.com
        PGADMIN_DEFAULT_PASSWORD: admin
      ports:
        - "5050:80" 
      depends_on:
        - db

volumes:
  postgres_data: